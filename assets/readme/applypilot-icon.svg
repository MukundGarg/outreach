<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7759" />
      <stop offset="100%" stop-color="#1e543e" />
    </linearGradient>
  </defs>
  <!-- Rounded brand squircle container matching .brand-icon -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#brand-grad)" />
  <!-- Compass Icon in white (#ffffff) stroke 2.25 matching Lucide Compass -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 10)">
    <circle cx="14" cy="14" r="12" />
    <polygon points="17.5 10.5 15.5 15.5 10.5 17.5 12.5 12.5 17.5 10.5" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" />
  </g>
</svg>
